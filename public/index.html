<style>

}

</style></head><body>
<div id="login" hidden><img class="logo" src="/icon.svg" alt="Asclepius logo"><h1>Asclepius</h1><p class="muted">Private study workspace.</p>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password"><div class="row"><button class="p" id="go">Sign in</button></div><p class="err" id="lerr"></p></div>
<div id="offline" hidden>You are offline. You can still read what you opened before, and reviews are saved to sync later.</div>
<div id="toast" hidden></div>
<div id="app" hidden>
<header><h1><img class="logo" src="/icon.svg" alt="">Asclepius</h1><div class="hr"><span class="muted" id="crumb" style="color:var(--headmuted)"></span><button id="chip" hidden title="Open the focus timer"></button><button id="theme" title="Change light / dark mode"></button></div></header>
<main><nav id="nav"></nav><section id="main"><p class="muted">Loading…</p></section></main></div>
<script src="/slidebank.js"></script>
<script src="/codeblue.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
const pad=n=>String(n).padStart(2,"0");
const localDay=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtMin=s=>{const m=Math.round(s/60);return m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`};
const fmtHrs=s=>(s/3600).toFixed(1)+" h";
const wide=()=>innerWidth>760;
let courses=[],cur=null,view="today",flash="";
let settings={focusMin:25,shortMin:5,longMin:15,longEvery:4,dailyGoalMin:120};

/* ---------- network ---------- */
const netErr=()=>Object.assign(new Error("You seem to be offline, or the server cannot be reached right now."),{net:1});
async function api(u,o={}){let r;try{r=await fetch(u,o)}catch{throw netErr()}
 if(r.status===401&&u!=="/api/login"){showLogin();throw new Error("login")}
 if(r.status===413)throw new Error("That is too large to send to the server in one go.");
 if([502,503,504].includes(r.status)&&!(r.headers.get("content-type")||"").includes("json"))throw Object.assign(new Error("The server is busy or took too long. Wait a moment and try again."),{net:1});
 const ct=r.headers.get("content-type")||"";if(!r.ok){const j=ct.includes("json")?await r.json().catch(()=>({})):{};throw new Error(j.error||"Something went wrong ("+r.status+")")}
 return ct.includes("json")?r.json():r.blob()}
const send=(m,u,b)=>api(u,{method:m,headers:{"content-type":"application/json"},body:JSON.stringify(b??{})});
const post=(u,b)=>send("POST",u,b);
function showLogin(){$("#app").hidden=true;$("#login").hidden=false}
$("#go").onclick=async()=>{$("#lerr").textContent="";try{await post("/api/login",{password:$("#pw").value});init()}catch(e){$("#lerr").textContent=e.message}};
$("#pw").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};
async function download(url,fallback){const r=await fetch(url);if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||"Download failed")}
 const name=(/filename="([^"]+)"/.exec(r.headers.get("content-disposition")||"")||[])[1]||fallback;
 const a=document.createElement("a");a.href=URL.createObjectURL(await r.blob());a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}

/* ---------- theme (auto / light / dark) ---------- */
const THEMES=["auto","light","dark"];
const getTheme=()=>{try{return localStorage.getItem("asc_theme")||"auto"}catch{return"auto"}};
function applyTheme(t){const h=document.documentElement;if(t==="auto")delete h.dataset.theme;else h.dataset.theme=t;
 try{localStorage.setItem("asc_theme",t)}catch{}
 const dark=t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
 $("#tc").content=dark?"#0A1216":"#14232B";$("#theme").textContent="Theme: "+t[0].toUpperCase()+t.slice(1)}
$("#theme").onclick=()=>applyTheme(THEMES[(THEMES.indexOf(getTheme())+1)%3]);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>applyTheme(getTheme()));
applyTheme(getTheme());

/* ---------- focus timer (works from timestamps, so sleeping phones and closed tabs stay accurate) ---------- */
const TK="asc_timer",PK="asc_pending";
const phaseMs=p=>(p==="focus"?settings.focusMin:p==="short"?settings.shortMin:settings.longMin)*60000;
const phaseName=p=>p==="focus"?"Focus":p==="short"?"Short break":"Long break";
let T=(()=>{try{const t=JSON.parse(localStorage.getItem(TK));if(t&&t.phase)return t}catch{}return{phase:"focus",running:false,remaining:null,endAt:0,dur:null,cycle:0,courseId:""}})();
const saveT=()=>{try{localStorage.setItem(TK,JSON.stringify(T))}catch{}};
function resetPhase(p){T.phase=p;T.dur=phaseMs(p);T.remaining=T.dur;T.running=false;T.endAt=0;saveT()}
const left=()=>T.running?Math.max(0,T.endAt-Date.now()):T.remaining;
const idle=()=>!T.running&&T.phase==="focus"&&T.remaining===T.dur;
const mmss=ms=>{const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+":"+pad(m):pad(m))+":"+pad(s%60)};
let actx=null;
function ensureAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume()}catch{}}
function beep(){try{ensureAudio();[0,.35,.7].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.2)})}catch{}
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch{}}
function notify(title,body){try{if(!("Notification"in window)||Notification.permission!=="granted")return;
 if(navigator.serviceWorker?.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:"/icon-192.png"})).catch(()=>{});else new Notification(title,{body,icon:"/icon-192.png"})}catch{}}
function timerStart(){ensureAudio();try{if("Notification"in window&&Notification.permission==="default")Notification.requestPermission()}catch{}
 if(T.dur==null)resetPhase("focus");if(!T.running){T.running=true;T.endAt=Date.now()+T.remaining;saveT()}drawTimer()}
function timerPause(){T.remaining=left();T.running=false;saveT();drawTimer()}
function timerSkip(){resetPhase("focus");drawTimer()}
async function timerStop(){const el=Math.floor((T.dur-left())/1000);let msg="";
 if(T.phase==="focus"&&el>=60){queueSession(el,Date.now());msg=`Logged ${fmtMin(el)}.`}else if(T.phase==="focus")msg="Under a minute, so nothing was logged.";
 resetPhase("focus");drawTimer(msg)}
function timerComplete(){const live=Date.now()-T.endAt<8000,was=T.phase,endAt=T.endAt;
 if(was==="focus"){queueSession(Math.round(T.dur/1000),endAt);T.cycle=(T.cycle||0)+1;
  const next=T.cycle%settings.longEvery===0?"long":"short",nd=phaseMs(next);
  if(endAt+nd>Date.now()){T.phase=next;T.dur=nd;T.running=true;T.endAt=endAt+nd;T.remaining=nd}else resetPhase("focus")}
 else resetPhase("focus");
 saveT();
 if(live){beep();notify(was==="focus"?"Focus session done":"Break over",was==="focus"?"Nice work. Time for a break.":"Ready for the next focus session?")}
 drawTimer()}
function queueSession(seconds,when){let q=[];try{q=JSON.parse(localStorage.getItem(PK))||[]}catch{}
 q.push({seconds,courseId:T.courseId||"",day:localDay(new Date(when)),cid:"c"+when+Math.random().toString(36).slice(2,7)});
 try{localStorage.setItem(PK,JSON.stringify(q))}catch{}flushPending()}
let flushing=false;
async function flushPending(){if(flushing)return;flushing=true;

  else if(m=/^>\s?(.*)$/.exec(l)){shut();h+=`<blockquote>${inl(m[1])}</blockquote>`}

  done++;say(`Step 3 of 4: writing section ${done} of ${total}…`)});

 say("Step 4 of 4: glossary, high-yield facts and practice questions…");
 let ex={glossary:[],high_yield:[],pitfalls:[],questions:[]};
 try{ex=(await twice(()=>jpost("/api/guide/extras",{courseId:id,topic,research:rs,outline:ol,digest:got.map(s=>`${s.heading}: ${s.intro} ${s.points.slice(0,4).join(" ")}`)}))).extras}catch(e){if(e.message==="login")throw e}

 else if(ALM.tone==="digital"){for(let i=0;i<8;i++)note(i%2?1200:1000,i*.22,.12,"square",.25)}

/* lecture recorder */
let lr=null;
function pLecture(){$("#pbody").innerHTML=`<div class="card"><p class="muted sm">Record a lecture (or upload a recording, up to 18 MB) and get a transcript, clean notes and flashcards. Needs a Gemini key. Record only where lecturers allow it. Keep the screen on while recording: phones usually stop recording when the screen locks.</p>${pickRow()}<input id="lt1" placeholder="Lecture title" style="width:100%;margin:6px 0"><div class="row"><button class="p" id="lrs">Start recording</button><button id="lrx" disabled>Stop</button><label class="muted fl">or upload <input type="file" id="lrf" accept="audio/*"></label></div><p class="sm" id="lrm"></p><textarea id="ltx" rows="10" placeholder="The transcript appears here. You can edit it."></textarea><button class="p" id="lrn">Make notes + flashcards</button><div id="lro"></div></div>`;
 const say=t=>$("#lrm").textContent=t;let queue=[],busy=false;
 const pump=async()=>{if(busy)return;busy=true;while(queue.length){const b=queue.shift();say(`Transcribing… (${queue.length} waiting)`);try{const fd=new FormData();fd.append("audio",b,"lecture."+(b.type.includes("mp4")?"m4a":b.type.includes("ogg")?"ogg":"webm"));const r=await api("/api/lecture/transcribe",{method:"POST",body:fd});$("#ltx").value+=($("#ltx").value?"\n\n":"")+r.text}catch(e){say(e.message+" If recording does not work on your phone, record with your phone's voice recorder and upload the file.");}}busy=false;if(!lr)say("Transcript ready.")};
 $("#lrf").onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>18*1024*1024){say("That file is over 18 MB. Trim it or split it into parts.");return}queue.push(f);pump()};
 $("#lrs").onclick=async()=>{try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),mt=["audio/webm;codecs=opus","audio/mp4","audio/ogg;codecs=opus"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
   lr={on:true,st,t0:Date.now()};try{lr.wl=await navigator.wakeLock.request("screen")}catch{}
   const cycle=()=>{if(!lr||!lr.on)return;const parts=[],mr=mt?new MediaRecorder(st,{mimeType:mt}):new MediaRecorder(st);mr.ondataavailable=e=>e.data.size&&parts.push(e.data);mr.onstop=()=>{if(parts.length){queue.push(new Blob(parts,{type:mr.mimeType}));pump()}};mr.start();lr.mr=mr;lr.timer=setTimeout(()=>{mr.stop();cycle()},240000)};cycle();
   $("#lrs").disabled=true;$("#lrx").disabled=false;lr.tick=setInterval(()=>say("Recording… "+mmss(Date.now()-lr.t0)+" (sent for transcription every 4 minutes)"),1000)}catch(e){say("Could not use the microphone: "+e.message)}};
 $("#lrx").onclick=()=>{if(!lr)return;lr.on=false;clearTimeout(lr.timer);clearInterval(lr.tick);try{lr.mr.stop()}catch{}lr.st.getTracks().forEach(t=>t.stop());try{lr.wl&&lr.wl.release()}catch{}lr=null;$("#lrs").disabled=false;$("#lrx").disabled=true;say("Stopped. Finishing transcription…")};
 $("#lrn").onclick=async()=>{const o=$("#lro");o.innerHTML="<p class='muted'>Making notes…</p>";try{const r=await post("/api/lecture/notes",{courseId:$("#pc").value,text:$("#ltx").value});
   await post("/api/materials",{courseId:$("#pc").value,type:"note",title:($("#lt1").value||"Lecture")+" (notes)",body:r.notes,translate:"0"});dueN+=r.cards;paintDue&&paintDue();
   o.innerHTML=`<p class="ok">Notes saved to the course, and ${r.cards} flashcards added (see Today).</p><div class="md">${md(r.notes)}</div>`}catch(e){o.innerHTML=`<p class="err">${esc(e.message)}</p>`}}}

/* settings, lock, text size, heatmap, offline */

const pinHash=async(pin,salt)=>{const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pin));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")};
function lockShow(){let p=null;try{p=JSON.parse(localStorage.getItem(PINK)||"null")}catch{}if(!p||document.getElementById("lockscr"))return;
 const d=document.createElement("div");d.id="lockscr";d.style.cssText="position:fixed;inset:0;z-index:200;background:var(--paper,#fff);color:var(--ink,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px";
 d.innerHTML=`<h2>Asclepius</h2><p class="muted">Enter your PIN</p><input id="lkp" type="password" inputmode="numeric" autocomplete="off" style="font-size:24px;text-align:center;width:180px"><button class="p" id="lkb">Unlock</button><p id="lkm" class="err sm"></p>`;document.body.appendChild(d);let bad=0;
 const go=async()=>{if(!(crypto.subtle)){$("#lkm").textContent="This browser cannot check the PIN here.";return}if((await pinHash($("#lkp").value,p.salt))===p.hash){d.remove()}else{bad++;$("#lkp").value="";$("#lkm").textContent=bad>=5?"Too many tries. Wait 30 seconds.":"Wrong PIN.";if(bad>=5){$("#lkb").disabled=true;setTimeout(()=>{bad=0;$("#lkb").disabled=false;$("#lkm").textContent=""},30000)}}};

async function heatDraw(el){let h={};try{h=await api("/api/heatmap")}catch(e){el.innerHTML=`<p class="err">${esc(e.message)}</p>`;return}
 const today=new Date(localDay()+"T00:00:00"),W=26,cells=[];const start=new Date(today);start.setDate(start.getDate()-today.getDay()-(W-1)*7);
 for(let w=0;w<W;w++)for(let d=0;d<7;d++){const dt=new Date(start);dt.setDate(start.getDate()+w*7+d);if(dt>today)continue;const k=dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate()),v=h[k]||{},sc=(v.focusSec||0)/600+(v.cards||0)/10+(v.quiz||0)/10,lv=sc===0?0:sc<1.5?1:sc<4?2:sc<8?3:4;cells.push(`<rect x="${w*14}" y="${d*14}" width="12" height="12" rx="2" fill="${lv?"rgba(46,160,67,"+[0,.3,.55,.8,1][lv]+")":"var(--line,#ddd)"}"><title>${k}: ${Math.round((v.focusSec||0)/60)} min, ${v.cards||0} cards, ${v.quiz||0} answers</title></rect>`)}
 const days=Object.keys(h).length;el.innerHTML=`<div style="overflow:auto"><svg width="${W*14}" height="98" viewBox="0 0 ${W*14} 98" style="max-width:none">${cells.join("")}</svg></div><p class="muted sm">Last 26 weeks. Darker means more focus time, cards and quiz answers that day. ${days} active day(s).</p>`}

async function pushSub(){if(!pushOk())return null;try{const reg=await navigator.serviceWorker.ready;return await reg.pushManager.getSubscription()}catch{return null}}
async function pushEnable(){if(!pushOk())throw new Error("This browser cannot receive notifications while closed. On an iPhone, add Asclepius to the Home Screen first (Share, Add to Home Screen), then open it from there.");
 const perm=await Notification.requestPermission();if(perm!=="granted")throw new Error("Notifications were blocked. Allow them for this site in the browser settings, then try again.");
 const reg=await navigator.serviceWorker.ready,{key}=await api("/api/push/key");let sub=await reg.pushManager.getSubscription();
 if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:keyBytes(key)});
 await post("/api/push/subscribe",{sub:sub.toJSON(),tz:tzMin()});return sub}
async function pushDisable(){const sub=await pushSub();if(sub){const ep=sub.endpoint;await sub.unsubscribe().catch(()=>{});await post("/api/push/unsubscribe",{endpoint:ep}).catch(()=>{})}}
async function pushResync(){try{if(!pushOk()||Notification.permission!=="granted")return;const sub=await pushSub();if(sub)await post("/api/push/subscribe",{sub:sub.toJSON(),tz:tzMin()})}catch{}}
async function pushCard(){const m=$("#main");if(!m||view!=="settings")return;let st={devices:0,notify:{}},sub=await pushSub();try{st=await api("/api/push/status")}catch{}
 const n={cards:true,blocks:true,exams:true,streak:true,...(st.notify||{})},on=!!sub&&Notification.permission==="granted";
 const ago=st.lastCheck?Math.round((Date.now()-st.lastCheck)/60000):null;
 const html=`<div class="card" id="pushcard"><h3>Notifications when the app is closed</h3>
 <p class="muted sm">Sends a notification to this phone for your timetable blocks, the daily flashcard reminder, exam countdowns (14, 7, 3, 1 days and on the day) and a nudge at 19:00 if your streak is at risk. Status: <b>${on?"on for this device":"off"}</b>${st.devices?` · ${st.devices} device${st.devices===1?"":"s"} registered`:""}.</p>
 <div class="row"><button class="p" id="pne">${on?"Re-register this device":"Turn on notifications"}</button>${on?'<button id="pnt">Send a test now</button><button class="d" id="pnd">Turn off</button>':""}</div>
 <div id="pnp" ${on?"":"hidden"}><label class="sm"><input type="checkbox" data-pn="blocks" ${n.blocks?"checked":""}> Timetable blocks, when they start</label><br><label class="sm"><input type="checkbox" data-pn="cards" ${n.cards?"checked":""}> Daily flashcard reminder (the time is set on Today, Daily review reminder)</label><br><label class="sm"><input type="checkbox" data-pn="exams" ${n.exams?"checked":""}> Exam countdowns</label><br><label class="sm"><input type="checkbox" data-pn="streak" ${n.streak?"checked":""}> Streak at risk</label></div>
 <p class="sm" id="pnm"></p>
 <details><summary class="sm"><b>One-time setup for on-time delivery</b></summary><p class="sm">A closed app cannot wake itself, so the server has to send each notification at the right minute. Create a free job at cron-job.org (or any scheduler) that opens this address every minute: <code>${esc(location.origin)}/api/cron/notify?key=YOUR_CRON_SECRET</code>, where YOUR_CRON_SECRET is the CRON_SECRET value in your Vercel environment variables. ${st.cronSecretSet?"CRON_SECRET is set on your server.":"<b>CRON_SECRET is not set yet</b>: add it in your Vercel environment variables and redeploy."} ${ago===null?"The server has not been called by a scheduler yet.":`The server last checked ${ago<1?"less than a minute":ago+" minute"+(ago===1?"":"s")} ago.`} Without a scheduler, only the Send a test now button works.</p></details></div>`;
 document.getElementById("pushcard")?.remove();m.querySelector("h2").insertAdjacentHTML("afterend",html);
 const say=t=>$("#pnm").textContent=t;
 $("#pne").onclick=async()=>{say("Turning on…");try{await pushEnable();say("On. Tap Send a test now to check.");pushCard()}catch(e){say(e.message)}};
 const t=$("#pnt");if(t)t.onclick=async()=>{say("Sending…");try{const r=await post("/api/push/test",{});say(r.results.every(x=>x.ok)?"Sent. If the app is closed you should see it on your lock screen in a moment.":"Sent, but a device did not accept it (status "+(r.results.find(x=>!x.ok)||{}).status+"). Try Re-register this device.")}catch(e){say(e.message)}};
 const d=$("#pnd");if(d)d.onclick=async()=>{await pushDisable();say("Turned off.");pushCard()};
 document.querySelectorAll("[data-pn]").forEach(c=>c.onchange=async()=>{try{await send("PUT","/api/settings",{notify:{[c.dataset.pn]:c.checked}})}catch(e){say(e.message)}})}
{const _vs=viewSettings;viewSettings=async function(){await _vs();pushCard()}}
if("serviceWorker"in navigator)navigator.serviceWorker.addEventListener("message",e=>{const d=e.data||{};if(d.type==="push")toast((d.title?d.title+": ":"")+(d.body||""));if(d.type==="go"){const g=(String(d.url).match(/[?&]go=(\w+)/)||[])[1];if(g&&VIEWS[g]&&!$("#app").hidden)go(g)}});
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js");
init();
</script></body></html>
