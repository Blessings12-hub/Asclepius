<style>
:root{--ink:#14232B;--paper:#EAF0EF;--card:#fff;--line:#C9D6D3;--acc:#1F7A5C;--accfg:#fff;--bad:#B3261E;--muted:#5a6d70;--sel:#d5e4e0;--input:#fff;--head:#14232B;--headfg:#fff;--headmuted:#9fb7b1;--viewer:#dfe9e6;--okbg:#cfeadf;--badbg:#f3d3d0;--tabon:#14232B;--tabonfg:#fff;--track:#dbe6e3;color-scheme:light}

*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--paper)}
h1,h2,h3{font-family:Georgia,serif;margin:.2em 0}

section{padding:18px;max-width:900px;width:100%;min-width:0}
input[type=file]{max-width:100%;min-width:0}
label.fl{display:block;width:100%}label.fl input{width:100%}

input,select,textarea,button{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
textarea{width:100%;min-height:90px}input[type=text],input[type=url],input[type=password],input:not([type]){width:100%}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);cursor:pointer;font-weight:600}button.d{color:var(--bad);cursor:pointer}
button{cursor:pointer}button:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
.tabs button{cursor:pointer}.tabs button.on{background:var(--tabon);color:var(--tabonfg)}
pre{white-space:pre-wrap;font:inherit}iframe,model-viewer{width:100%;height:340px;border:1px solid var(--line);border-radius:6px;background:var(--viewer)}

.logo{display:block;border-radius:22%}#login .logo{width:84px;height:84px;margin:0 0 14px}header h1{display:flex;align-items:center;gap:10px}header .logo{width:30px;height:30px}

/* offline bar, toast, error box, badge, search hits */

 input,select,textarea,button{font-size:16px}

}

.md p{margin:.45em 0}.md ul,.md ol{margin:.3em 0 .7em;padding-left:1.3em}.md li{margin:.28em 0}.md li.sub{margin-left:1.2em;list-style:circle}

.md hr{border:0;border-top:1px solid var(--line);margin:1em 0}.tw{overflow-x:auto}.md b{font-weight:700}.md sup{color:var(--acc);font-weight:700}
.sgh{background:var(--head);color:var(--headfg);border-radius:10px;padding:14px 16px;margin:6px 0 10px;border-bottom:4px solid var(--acc)}.sgh h3{color:var(--headfg);margin:0 0 4px;font-size:21px}.sgh p{margin:0;opacity:.92}

.pts{margin:.2em 0 .8em;padding-left:1.2em}.pts li{margin:.4em 0}.pts b{color:var(--acc)}.mn{font-style:italic;color:var(--acc);margin:0 0 10px}
.co{border-radius:8px;padding:10px 14px;margin:10px 0;border-left:5px solid}.co h4{margin:0 0 2px;font-family:Georgia,serif;font-size:16px}.hy{background:var(--okbg);border-color:var(--acc)}.pf{background:var(--badbg);border-color:var(--bad)}.co .pts b{color:inherit}
.sgq h4{font-family:Georgia,serif;font-size:17px;margin:14px 0 2px}.sgq details{border-bottom:1px solid var(--line);padding:8px 0}.sgq summary{cursor:pointer}.sgq details p{margin:.5em 0 .2em 1.4em;color:var(--muted)}
.acts button{font-size:14px}.dk h3{font-size:19px}.ds{display:flex;gap:12px;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;background:var(--card)}
.ds img,.ds .ph{width:132px;height:92px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;flex:none}.ds .ph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;background:var(--viewer)}
.ds ul{margin:.3em 0;padding-left:1.1em;font-size:14px}.ds .cr{font-size:11px;color:var(--muted);margin-top:4px}.ds>div{min-width:0;flex:1}
@media(max-width:760px){.ds{flex-direction:column}.ds img,.ds .ph{width:100%;height:150px}}
</style></head><body>
<div id="login" hidden><img class="logo" src="/icon.svg" alt="Asclepius logo"><h1>Asclepius</h1><p class="muted">Private study workspace.</p>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password"><div class="row"><button class="p" id="go">Sign in</button></div><p class="err" id="lerr"></p></div>
<div id="offline" hidden>You are offline. You can still read what you opened before, and reviews are saved to sync later.</div>
<div id="toast" hidden></div>
<div id="app" hidden>
<header><h1><img class="logo" src="/icon.svg" alt="">Asclepius</h1><div class="hr"><span class="muted" id="crumb" style="color:var(--headmuted)"></span><button id="chip" hidden title="Open the focus timer"></button><button id="theme" title="Change light / dark mode"></button></div></header>
<main><nav id="nav"></nav><section id="main"><p class="muted">Loading…</p></section></main></div>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
const pad=n=>String(n).padStart(2,"0");
const localDay=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtMin=s=>{const m=Math.round(s/60);return m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`};
const fmtHrs=s=>(s/3600).toFixed(1)+" h";
const wide=()=>innerWidth>760;
let courses=[],cur=null,view="today",flash="";
let settings={focusMin:25,shortMin:5,longMin:15,longEvery:4,dailyGoalMin:120};

/* ---------- network ---------- */
const netErr=()=>Object.assign(new Error("You seem to be offline, or the server cannot be reached right now."),{net:1});
async function api(u,o={}){let r;try{r=await fetch(u,o)}catch{throw netErr()}
 if(r.status===401&&u!=="/api/login"){showLogin();throw new Error("login")}
 if(r.status===413)throw new Error("That is too large to send to the server in one go.");
 if([502,503,504].includes(r.status)&&!(r.headers.get("content-type")||"").includes("json"))throw Object.assign(new Error("The server is busy or took too long. Wait a moment and try again."),{net:1});
 const ct=r.headers.get("content-type")||"";if(!r.ok){const j=ct.includes("json")?await r.json().catch(()=>({})):{};throw new Error(j.error||"Something went wrong ("+r.status+")")}
 return ct.includes("json")?r.json():r.blob()}
const send=(m,u,b)=>api(u,{method:m,headers:{"content-type":"application/json"},body:JSON.stringify(b??{})});
const post=(u,b)=>send("POST",u,b);
function showLogin(){$("#app").hidden=true;$("#login").hidden=false}
$("#go").onclick=async()=>{$("#lerr").textContent="";try{await post("/api/login",{password:$("#pw").value});init()}catch(e){$("#lerr").textContent=e.message}};
$("#pw").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};
async function download(url,fallback){const r=await fetch(url);if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||"Download failed")}
 const name=(/filename="([^"]+)"/.exec(r.headers.get("content-disposition")||"")||[])[1]||fallback;
 const a=document.createElement("a");a.href=URL.createObjectURL(await r.blob());a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}

/* ---------- theme (auto / light / dark) ---------- */
const THEMES=["auto","light","dark"];
const getTheme=()=>{try{return localStorage.getItem("asc_theme")||"auto"}catch{return"auto"}};
function applyTheme(t){const h=document.documentElement;if(t==="auto")delete h.dataset.theme;else h.dataset.theme=t;
 try{localStorage.setItem("asc_theme",t)}catch{}
 const dark=t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
 $("#tc").content=dark?"#0A1216":"#14232B";$("#theme").textContent="Theme: "+t[0].toUpperCase()+t.slice(1)}
$("#theme").onclick=()=>applyTheme(THEMES[(THEMES.indexOf(getTheme())+1)%3]);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>applyTheme(getTheme()));
applyTheme(getTheme());

/* ---------- focus timer (works from timestamps, so sleeping phones and closed tabs stay accurate) ---------- */
const TK="asc_timer",PK="asc_pending";
const phaseMs=p=>(p==="focus"?settings.focusMin:p==="short"?settings.shortMin:settings.longMin)*60000;
const phaseName=p=>p==="focus"?"Focus":p==="short"?"Short break":"Long break";
let T=(()=>{try{const t=JSON.parse(localStorage.getItem(TK));if(t&&t.phase)return t}catch{}return{phase:"focus",running:false,remaining:null,endAt:0,dur:null,cycle:0,courseId:""}})();
const saveT=()=>{try{localStorage.setItem(TK,JSON.stringify(T))}catch{}};
function resetPhase(p){T.phase=p;T.dur=phaseMs(p);T.remaining=T.dur;T.running=false;T.endAt=0;saveT()}
const left=()=>T.running?Math.max(0,T.endAt-Date.now()):T.remaining;
const idle=()=>!T.running&&T.phase==="focus"&&T.remaining===T.dur;
const mmss=ms=>{const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+":"+pad(m):pad(m))+":"+pad(s%60)};
let actx=null;
function ensureAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume()}catch{}}
function beep(){try{ensureAudio();[0,.35,.7].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.2)})}catch{}
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch{}}
function notify(title,body){try{if(!("Notification"in window)||Notification.permission!=="granted")return;
 if(navigator.serviceWorker?.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:"/icon-192.png"})).catch(()=>{});else new Notification(title,{body,icon:"/icon-192.png"})}catch{}}
function timerStart(){ensureAudio();try{if("Notification"in window&&Notification.permission==="default")Notification.requestPermission()}catch{}
 if(T.dur==null)resetPhase("focus");if(!T.running){T.running=true;T.endAt=Date.now()+T.remaining;saveT()}drawTimer()}
function timerPause(){T.remaining=left();T.running=false;saveT();drawTimer()}
function timerSkip(){resetPhase("focus");drawTimer()}
async function timerStop(){const el=Math.floor((T.dur-left())/1000);let msg="";
 if(T.phase==="focus"&&el>=60){queueSession(el,Date.now());msg=`Logged ${fmtMin(el)}.`}else if(T.phase==="focus")msg="Under a minute, so nothing was logged.";
 resetPhase("focus");drawTimer(msg)}
function timerComplete(){const live=Date.now()-T.endAt<8000,was=T.phase,endAt=T.endAt;
 if(was==="focus"){queueSession(Math.round(T.dur/1000),endAt);T.cycle=(T.cycle||0)+1;
  const next=T.cycle%settings.longEvery===0?"long":"short",nd=phaseMs(next);
  if(endAt+nd>Date.now()){T.phase=next;T.dur=nd;T.running=true;T.endAt=endAt+nd;T.remaining=nd}else resetPhase("focus")}
 else resetPhase("focus");
 saveT();
 if(live){beep();notify(was==="focus"?"Focus session done":"Break over",was==="focus"?"Nice work. Time for a break.":"Ready for the next focus session?")}
 drawTimer()}
function queueSession(seconds,when){let q=[];try{q=JSON.parse(localStorage.getItem(PK))||[]}catch{}
 q.push({seconds,courseId:T.courseId||"",day:localDay(new Date(when)),cid:"c"+when+Math.random().toString(36).slice(2,7)});
 try{localStorage.setItem(PK,JSON.stringify(q))}catch{}flushPending()}
let flushing=false;
async function flushPending(){if(flushing)return;flushing=true;
 try{let q=[];try{q=JSON.parse(localStorage.getItem(PK))||[]}catch{}
  while(q.length){try{await post("/api/sessions",q[0])}catch(e){if(e.net||e instanceof TypeError||e.message==="login")break;/* server refused it: drop it */}
   q.shift();try{localStorage.setItem(PK,JSON.stringify(q))}catch{}}
  if(view==="focus"&&$("#recent"))drawRecent()}finally{flushing=false}}
addEventListener("online",flushPending);
function tick(){if(T.running&&Date.now()>=T.endAt)timerComplete();

 const el=$("#tt");if(el){el.textContent=mmss(left());const b=$("#tbar");if(b)b.style.width=(100*(1-left()/T.dur)).toFixed(1)+"%"}}

/* ---------- friendly errors, toast, offline bar ---------- */
function errBox(e,retry){const off=e&&e.net;
 return `<div class="card errbox"><img class="logo" src="/icon.svg" alt=""><h3>${off?"No connection":"Something went wrong"}</h3><p class="muted">${esc(e&&e.message||"Unknown problem")}</p>
 ${off?'<p class="muted sm">Anything you opened before is still available while you are offline.</p>':""}<div class="row" style="justify-content:center"><button class="p" id="retry">Try again</button></div></div>`}
function showErr(e,retry){$("#main").innerHTML=errBox(e);const b=$("#retry");if(b)b.onclick=retry||(()=>go(view in TITLES?view:"today"))}
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4500)}
function setOnline(){$("#offline").hidden=navigator.onLine}
addEventListener("online",()=>{setOnline();flushReviews();flushPending();refreshDue()});addEventListener("offline",setOnline);setOnline();
addEventListener("unhandledrejection",ev=>{const m=ev.reason&&ev.reason.message;if(m&&m!=="login"&&!(ev.reason&&ev.reason.net)){toast(m);}});

/* ---------- flashcard reviews saved offline, and the due-cards badge + reminders ---------- */
const RQ="asc_review_queue";let dueN=0,rflushing=false;
const rqGet=()=>{try{return JSON.parse(localStorage.getItem(RQ))||[]}catch{return[]}};
const rqSet=q=>{try{localStorage.setItem(RQ,JSON.stringify(q))}catch{}};
async function flushReviews(){if(rflushing)return;rflushing=true;
 try{let q=rqGet();while(q.length){try{await post(`/api/cards/${q[0].id}/review`,q[0])}catch(e){if(e.net||e.message==="login")break;/* card gone or refused: drop it */}q.shift();rqSet(q)}}finally{rflushing=false}}
function paintDue(){document.title=(dueN?`(${dueN}) `:"")+"Asclepius";try{if(navigator.setAppBadge)dueN?navigator.setAppBadge(dueN):navigator.clearAppBadge()}catch{}
 const b=document.querySelector('[data-v="today"] b');if(b)b.innerHTML=TITLES.today+(dueN?` <span class="badge">${dueN}</span>`:"")}
async function refreshDue(){try{await flushReviews();dueN=(await api("/api/cards/count")).due||0}catch{return}paintDue();checkReminder()}
function checkReminder(){try{const t=settings.reminderTime;if(!t||!dueN)return;
 const n=new Date(),now=pad(n.getHours())+":"+pad(n.getMinutes());if(now<t)return;
 const k=localDay();if(localStorage.getItem("asc_rem_day")===k)return;localStorage.setItem("asc_rem_day",k);
 notify("Time to review",`${dueN} flashcard${dueN===1?" is":"s are"} due. A few minutes keeps them fresh.`);toast(`${dueN} flashcards are due`)}catch{}}
setInterval(()=>{if(!$("#app").hidden)refreshDue()},5*60e3);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!$("#app").hidden)refreshDue()});
function icsFile(time){const[h,m]=time.split(":"),d=new Date(),p=n=>String(n).padStart(2,"0");
 const st=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${h}${m}00`,stamp=new Date().toISOString().replace(/[-:]|\.\d+/g,"");
 const t=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Asclepius//Review reminder//EN","BEGIN:VEVENT","UID:asclepius-review@"+location.host,"DTSTAMP:"+stamp,"DTSTART:"+st,"DURATION:PT15M","RRULE:FREQ=DAILY",
 "SUMMARY:Review flashcards (Asclepius)","DESCRIPTION:Open Asclepius and clear your due cards.","URL:"+location.origin,"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Review flashcards","TRIGGER:PT0M","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/calendar"}));a.download="asclepius-review.ics";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}

/* ---------- uploads: straight to storage when the server is on Vercel, through the server when local ---------- */
function putFile(url,file,type,onp){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open("PUT",url);x.setRequestHeader("content-type",type);
 x.upload.onprogress=e=>e.lengthComputable&&onp&&onp(Math.round(100*e.loaded/e.total));
 x.onload=()=>x.status<300?res():rej(new Error("Upload to storage failed ("+x.status+")"));x.onerror=()=>rej(new Error("Upload failed. Check your connection."));x.send(file)})}
async function uploadFile(file,onp){const i=await post("/api/upload-url",{filename:file.name,size:file.size});
 if(i.mode!=="cloud")return null;await putFile(i.uploadUrl,file,i.contentType,onp);return{fileKey:i.key,fileName:file.name}}

/* ---------- tidy display of AI answers ---------- */
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[\s(])\*([^\s*][^*]*?)\*(?=[\s).,;:!?]|$)/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\[(\d+)\]/g,"<sup>[$1]</sup>");
function md(src){const L=String(src||"").replace(/\r/g,"").split("\n");let h="",i=0,op="";const shut=()=>{if(op){h+=`</${op}>`;op=""}};
 const cells=l=>l.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim()),isRow=l=>/^\s*\|.*\|\s*$/.test(l||"");
 while(i<L.length){const l=L[i];let m;
  if(isRow(l)&&/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[i+1]||"")){shut();const hd=cells(l),rows=[];i+=2;while(isRow(L[i]))rows.push(cells(L[i++]));
   h+=`<div class="tw"><table class="ref"><thead><tr>${hd.map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${hd.map((c,k)=>`<td data-label="${esc(c)}">${inl(r[k]||"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;continue}
  if(m=/^\s{0,3}(#{1,6})\s+(.*)$/.exec(l)){shut();h+=`<h4 class="mh${m[1].length<=2?" big":""}">${inl(m[2])}</h4>`}
  else if(/^\s*([-*_])\1{2,}\s*$/.test(l)){shut();h+="<hr>"}
  else if(m=/^(\s*)[-*•]\s+(.*)$/.exec(l)){if(op!=="ul"){shut();h+="<ul>";op="ul"}h+=`<li${m[1].length>=2?' class="sub"':""}>${inl(m[2])}</li>`}
  else if(m=/^\s*\d+[.)]\s+(.*)$/.exec(l)){if(op!=="ol"){shut();h+="<ol>";op="ol"}h+=`<li>${inl(m[1])}</li>`}
  else if(m=/^>\s?(.*)$/.exec(l)){shut();h+=`<blockquote>${inl(m[1])}</blockquote>`}
  else if(!l.trim())shut();
  else{shut();h+=`<p>${inl(l.trim())}</p>`}
  i++}
 shut();return h}
const pts=a=>`<ul class="pts">${a.map(t=>{const m=/^(.{2,42}?):\s+(.+)$/.exec(t);return `<li>${m?`<b>${esc(m[1])}</b> ${esc(m[2])}`:esc(t)}</li>`}).join("")}</ul>`;
const srcLinks=a=>(a||[]).length?`<p class="sm muted">Read more: ${a.map(x=>x.url&&safeUrl(x.url)?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>`:esc(x.title)).join(" · ")}</p>`:"";
function guideHTML(g){return `<div class="sg"><div class="sgh"><h3>${esc(g.title)}</h3>${g.overview?`<p>${esc(g.overview)}</p>`:""}</div>`+
 g.sections.map((s,i)=>`<details class="sgs"${i<2?" open":""}><summary>${esc(s.heading)}</summary>${pts(s.points)}${s.mnemonic?`<p class="mn">Memory aid: ${esc(s.mnemonic)}</p>`:""}</details>`).join("")+
 (g.high_yield.length?`<div class="co hy"><h4>High-yield</h4>${pts(g.high_yield)}</div>`:"")+(g.pitfalls.length?`<div class="co pf"><h4>Common pitfalls</h4>${pts(g.pitfalls)}</div>`:"")+
 (g.questions.length?`<div class="sgq"><h4>Test yourself</h4><p class="sm muted">Think first, then tap a question to see the answer.</p>${g.questions.map((x,i)=>`<details><summary><b>${i+1}.</b> ${esc(x.q)}</summary><p>${esc(x.a)}</p></details>`).join("")}</div>`:"")+srcLinks(g.sources)+`</div>`}
const guideTxt=g=>[g.title,"",g.overview,"",...g.sections.flatMap(s=>[s.heading.toUpperCase(),...s.points.map(p=>"- "+p),...(s.mnemonic?["Memory aid: "+s.mnemonic]:[]),""]),...(g.high_yield.length?["HIGH-YIELD",...g.high_yield.map(p=>"- "+p),""]:[]),...(g.pitfalls.length?["COMMON PITFALLS",...g.pitfalls.map(p=>"- "+p),""]:[]),...(g.questions.length?["PRACTICE QUESTIONS",...g.questions.flatMap((x,i)=>[`${i+1}. ${x.q}`,"   Answer: "+x.a])]:[])].join("\n");
const saveBlob=(b,name)=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
const fname=t=>(String(t||"").replace(/[^\w\- ]+/g,"").trim().slice(0,60)||"study");
const jpost=(u,b)=>api(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});

/* ---------- presentation: preview with pictures, then download ---------- */
let deck=null;
const dObj=k=>k===0?deck.cover:deck.slides[k-1];
const dText=s=>s.layout==="steps"?s.steps.map(x=>x.head):s.layout==="compare"?[s.left.head+" vs "+s.right.head]:s.layout==="facts"?s.facts.map(x=>x.value+" "+x.label):s.bullets;
function deckHTML(){const row=(k,o,title,lines)=>{const c=o.pick>=0?o.cands[o.pick]:null,n=o.cands.length;
  return `<div class="ds">${c?`<img src="${esc(c.url)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:`<div class="ph">${k===0||n?"No picture":"Text slide"}</div>`}<div><b>${esc(title)}</b><ul>${lines.slice(0,3).map(t=>`<li>${esc(t.length>90?t.slice(0,88)+"…":t)}</li>`).join("")}</ul>
  ${c?`<div class="cr">${esc(c.credit)}</div>`:""}${n?`<div class="row">${n>1&&c?`<button data-sw="${k}">Another picture (${o.pick+1}/${n})</button>`:""}${c?`<button data-no="${k}">No picture</button>`:`<button data-sw="${k}">Use a picture</button>`}</div>`:""}</div></div>`};
 return `<div class="dk"><h3>${esc(deck.title)}</h3><p class="sm muted">${deck.slides.length+2} slides with outline and sources. Check each picture fits, swap any you do not like, then download.</p>
 <div class="row"><label class="sm">Style <select id="dth">${Object.entries(deckThemes).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("")}</select></label><button class="p" id="d1">Download PowerPoint</button><button id="d2">Download PDF</button><button id="d3">Both</button><span class="sm muted" id="dm"></span></div>`+
 row(0,deck.cover,"Title slide: "+deck.title,[deck.subtitle].filter(Boolean))+deck.slides.map((s,i)=>row(i+1,s,s.title,dText(s))).join("")+srcLinks(deck.sources)+`</div>`}
let deckThemes={};
function wireDeck(id){const box=$("#deck");box.innerHTML=deckHTML();
 box.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{const o=dObj(+b.dataset.sw);o.pick=o.pick<0?0:(o.pick+1)%o.cands.length;wireDeck(id)});
 box.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>{dObj(+b.dataset.no).pick=-1;wireDeck(id)});
 const slim=o=>({...o,cands:o.pick>=0?[o.cands[o.pick]]:[],pick:o.pick>=0?0:-1});
 const get=async fmt=>{const b=await jpost("/api/deck/export",{deck:{...deck,cover:slim(deck.cover),slides:deck.slides.map(slim)},format:fmt,theme:$("#dth").value});saveBlob(b,fname(deck.title)+"."+fmt)};
 const run=fmts=>async()=>{const m=$("#dm");m.textContent="Building file… this can take 20 seconds";box.querySelectorAll("button").forEach(x=>x.disabled=true);
  try{for(const f of fmts){await get(f);if(fmts.length>1)await new Promise(r=>setTimeout(r,700))}m.textContent="Downloaded. Check the picture credits on the last slide."}catch(e){m.textContent=e.message}
  box.querySelectorAll("button").forEach(x=>x.disabled=false)};
 $("#d1").onclick=run(["pptx"]);$("#d2").onclick=run(["pdf"]);$("#d3").onclick=run(["pptx","pdf"])}

  <label class="f">Focus (min)<input type="number" id="s1" min="1" max="180" value="${settings.focusMin}"></label>
  <label class="f">Short break (min)<input type="number" id="s2" min="1" max="60" value="${settings.shortMin}"></label>
  <label class="f">Long break (min)<input type="number" id="s3" min="1" max="120" value="${settings.longMin}"></label>
  <label class="f">Long break every<input type="number" id="s4" min="2" max="10" value="${settings.longEvery}"></label>
  <label class="f">Daily goal (min)<input type="number" id="s5" min="10" max="720" value="${settings.dailyGoalMin}"></label></div>
  <div class="row"><button class="p" id="ssave">Save settings</button><span id="smsg" class="muted"></span></div></div>`;
 $("#tcourse").onchange=e=>{T.courseId=e.target.value;saveT()};
 $("#ssave").onclick=async()=>{try{settings=await send("PUT","/api/settings",{focusMin:$("#s1").value,shortMin:$("#s2").value,longMin:$("#s3").value,longEvery:$("#s4").value,dailyGoalMin:$("#s5").value});
  if(!T.running&&(idle()||T.phase!=="focus"&&T.remaining===T.dur))resetPhase(T.phase);$("#smsg").textContent="Saved.";drawTimer()}catch(e){$("#smsg").textContent=e.message;$("#smsg").className="err"}};
 drawTimer()}

/* ---------- drug and lab reference (editable) ---------- */
const REF={drugs:{title:"Drugs",first:"name",cols:[["name","Drug"],["cls","Class"],["use","Use / how it works"],["adverse","Main adverse effects"],["notes","Notes"]],long:["use","adverse","notes"]},
 labs:{title:"Lab values",first:"test",cols:[["test","Test"],["range","Normal range"],["notes","Notes"]],long:["range","notes"]}};
let refs=null,refTab="drugs",refQ="",refEdit=null;
async function viewRef(){refs=refs||await api("/api/refs");
 $("#main").innerHTML=`<h2>Drug and lab reference</h2>
 <div class="card"><p class="sm" style="margin:0"><b>For study, not for treating patients.</b> The starter rows come from general textbook knowledge and have no doses. Normal ranges differ between labs and countries. Check everything against your own textbooks and your hospital's or national guidelines, and edit any row.</p></div>
 <div class="row tabs"><button data-t="drugs">Drugs</button><button data-t="labs">Lab values</button></div>
 <div class="row"><input id="rq" placeholder="Search (name, class, effect…)" style="flex:1;min-width:180px" value="${esc(refQ)}"><button class="p" id="radd">+ Add row</button></div>
 <div id="rform"></div><div id="rtbl"></div>
 <div class="row"><button class="d" id="rreset">Reset this table to the starter list</button></div>`;
 document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{refTab=b.dataset.t;refEdit=null;refQ=$("#rq").value;drawRef()});
 $("#rq").oninput=e=>{refQ=e.target.value;drawRows()};
 $("#radd").onclick=()=>{refEdit="new";drawForm()};
 $("#rreset").onclick=async()=>{if(!confirm(`Replace every row in "${REF[refTab].title}" with the starter list? Your own edits to this table will be lost.`))return;
  try{await post(`/api/refs/${refTab}/reset`);refs=await api("/api/refs");refEdit=null;drawRef()}catch(e){alert(e.message)}};
 drawRef()}
function drawRef(){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===refTab));drawForm();drawRows()}
function drawRows(){const k=refTab,R=REF[k],q=refQ.toLowerCase().trim();
 const rows=refs[k].filter(r=>!q||R.cols.some(([f])=>String(r[f]).toLowerCase().includes(q))).sort((a,b)=>a[R.first].localeCompare(b[R.first]));
 $("#rtbl").innerHTML=rows.length?`<table class="ref"><thead><tr>${R.cols.map(([,l])=>`<th>${l}</th>`).join("")}<th></th></tr></thead><tbody>${
  rows.map(r=>`<tr>${R.cols.map(([f,l])=>`<td data-label="${l}">${esc(r[f])}</td>`).join("")}<td><button data-e="${r.id}">Edit</button> <button class="d" data-x="${r.id}">Delete</button></td></tr>`).join("")}</tbody></table><p class="muted sm">${rows.length} of ${refs[k].length} shown</p>`
  :`<p class="muted">${refs[k].length?"Nothing matches that search.":"This table is empty. Add a row or reset to the starter list."}</p>`;
 $("#rtbl").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{refEdit=b.dataset.e;drawForm();scrollTo({top:0,behavior:"smooth"})});
 $("#rtbl").querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{const r=refs[k].find(x=>x.id===b.dataset.x);if(!confirm(`Delete "${r[R.first]}"?`))return;
  try{await api(`/api/refs/${k}/${b.dataset.x}`,{method:"DELETE"});refs[k]=refs[k].filter(x=>x.id!==b.dataset.x);drawRows()}catch(e){alert(e.message)}})}
function drawForm(){const k=refTab,R=REF[k],box=$("#rform");if(!refEdit){box.innerHTML="";return}
 const row=refEdit==="new"?{}:refs[k].find(x=>x.id===refEdit)||{};
 box.innerHTML=`<div class="card"><h3>${refEdit==="new"?"Add a row":"Edit row"}</h3>${R.cols.map(([f,l])=>`<label class="f">${l}${R.long.includes(f)?`<textarea data-f="${f}" style="min-height:64px">${esc(row[f]||"")}</textarea>`:`<input data-f="${f}" value="${esc(row[f]||"")}">`}</label>`).join("")}
 <div class="row"><button class="p" id="rsave">Save</button><button id="rcancel">Cancel</button><span class="err" id="rerr"></span></div></div>`;
 $("#rcancel").onclick=()=>{refEdit=null;drawForm()};
 $("#rsave").onclick=async()=>{const body={};box.querySelectorAll("[data-f]").forEach(e=>body[e.dataset.f]=e.value);
  try{if(refEdit==="new"){refs[k].push(await post("/api/refs/"+k,body))}else{const r=await send("PUT",`/api/refs/${k}/${refEdit}`,body);refs[k]=refs[k].map(x=>x.id===r.id?r:x)}
   refEdit=null;drawForm();drawRows()}catch(e){$("#rerr").textContent=e.message}}}

/* ---------- backup and sync ---------- */
const KINDS={auto:"Automatic","manual":"Manual","pre-restore":"Before a restore"};
async function viewBackup0(){
 const [bk,h]=await Promise.all([api("/api/backup"),api("/api/health")]);
 const cloudy=bk.storage==="cloud";let lastDl=0;try{lastDl=+localStorage.getItem("asc_lastdl")||0}catch{}
 const checks=[
  cloudy?(h.storageOk===false?["Fix","Cloud storage is not working: "+(h.storageError||"unknown error")]:["OK","Cloud storage connected. Your data is saved online and is the same on every device you sign in on."])
   :h.vercel?["Fix","Cloud storage is not set up. See the README (Supabase steps)."]:["Note","Running in local mode: data is saved only on the computer running this app. Download a backup file regularly."],
  h.secretChanged?["OK","SECRET has been changed from the default."]:["Fix","SECRET is still the default. Set it to a long random value."],
  h.aiKeySet?["OK","AI is on via "+({gemini:"Google Gemini",groq:"Groq",openai:"your AI service",anthropic:"Anthropic"}[h.aiProvider]||h.aiProvider)+" (study help, flashcards, translation, presentations, photo notes)."]:["Fix","No AI key is set. Add GEMINI_API_KEY (free from Google AI Studio) or GROQ_API_KEY (free from Groq), then redeploy."],
  ...(cloudy?[h.cronSecretSet?["OK","Nightly backup is switched on."]:["Note","CRON_SECRET is not set, so there is no nightly backup. A backup is still made the first time you open the app each day."]]:[])];
 const when=s=>new Date(s).toLocaleString(undefined,{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
 $("#main").innerHTML=`<h2>Backup and sync</h2>
 <div class="card"><h3>Status</h3>${checks.map(([s,t])=>`<div class="row" style="margin:4px 0;align-items:flex-start"><span class="${s==="OK"?"ok":s==="Fix"?"err":"muted"}" style="min-width:42px"><b>${s}</b></span><span>${esc(t)}</span></div>`).join("")}</div>
 <div class="card"><h3>Back up now</h3>
  <p class="sm muted">Backups save your courses, notes, flashcards, quiz history, study time and reference tables. Uploaded files (PDFs, 3D models, photos) are not copied into backups. ${cloudy?"They stay safe in your cloud storage.":"They stay in the data/uploads folder."}</p>
  <div class="row"><button class="p" id="bnow">Back up now</button><button id="bdl">Download a backup file</button><label class="muted fl">Restore from a file <input type="file" id="bfile" accept=".json,application/json"></label></div>
  <p class="sm ${Date.now()-lastDl>14*864e5?"err":"muted"}">${lastDl?"Last file download: "+when(lastDl)+".":"You have not downloaded a backup file yet."} ${Date.now()-lastDl>14*864e5?"Download one now and keep it somewhere outside this app, in case the cloud account is ever lost.":""}</p><p id="bmsg" class="sm" aria-live="polite"></p></div>
 <div class="card"><h3>Saved backups</h3><p class="sm muted">Made automatically ${cloudy?"every night and ":""}the first time you open the app each day. The newest few of each kind are kept.</p>
  ${bk.items.map(b=>`<div class="mrow"><div><b>${KINDS[b.kind]||b.kind}</b> · ${esc(when(b.at))}</div><div class="muted sm">${b.counts.materials} materials · ${b.counts.cards} flashcards · ${b.counts.sessions} study sessions${b.bytes?` · ${(b.bytes/1024).toFixed(0)} KB`:""}</div>
  <div class="row"><button data-r="${b.id}">Restore this</button><button data-d="${b.id}">Download</button><button class="d" data-x="${b.id}">Delete</button></div></div>`).join("")||'<p class="muted">No backups yet.</p>'}</div>`;
 const msg=(t,bad)=>{$("#bmsg").textContent=t;$("#bmsg").className="sm "+(bad?"err":"ok")};
 $("#bnow").onclick=async()=>{try{await post("/api/backup");viewBackup()}catch(e){msg(e.message,1)}};
 $("#bdl").onclick=async()=>{try{await download("/api/backup/download","asclepius-backup.json");try{localStorage.setItem("asc_lastdl",Date.now())}catch{}msg("Downloaded. Keep the file somewhere safe.")}catch(e){msg(e.message,1)}};
 $("#bfile").onchange=async e=>{const f=e.target.files[0];if(!f)return;
  if(!confirm("Replace everything in the app with the contents of this file? A safety backup is made first, so you can undo it."))return;
  try{const data=JSON.parse(await f.text());const r=await post("/api/backup/restore",{data});courses=await api("/api/courses");refs=null;drawNav();msg(`Restored ${r.restored.materials} materials and ${r.restored.cards} flashcards.`);viewBackup()}catch(x){msg(x instanceof SyntaxError?"That file is not a valid backup.":x.message,1)}};
 document.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{if(!confirm("Replace everything in the app with this backup? A safety backup is made first, so you can undo it."))return;
  try{await post("/api/backup/restore",{id:b.dataset.r});courses=await api("/api/courses");refs=null;drawNav();viewBackup()}catch(x){msg(x.message,1)}});
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{try{await download("/api/backup/download?id="+b.dataset.d,"asclepius-backup.json")}catch(x){msg(x.message,1)}});
 document.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this backup?")){await api("/api/backup/"+b.dataset.x,{method:"DELETE"});viewBackup()}})}

async function viewBackup(){await viewBackup0();
 $("#main").insertAdjacentHTML("beforeend",'<div class="card"><h3>Security</h3><p class="sm muted">Sign out on this device. Use this on a shared phone or computer. It also clears the copy kept for offline use.</p><button id="so">Sign out</button></div>');
 $("#so").onclick=async()=>{try{await post("/api/logout")}catch{}try{const ks=await caches.keys();await Promise.all(ks.filter(k=>/data/.test(k)).map(k=>caches.delete(k)))}catch{}
  try{localStorage.removeItem(RQ)}catch{}dueN=0;paintDue();$("#pw").value="";showLogin()}}
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js");
init();
</script></body></html>
